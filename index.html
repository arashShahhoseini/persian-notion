<!DOCTYPE html>
<html lang="fa" dir="rtl">
    <head>

    <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="app">
            <main>
                <aside class="sidebar">
                    <div class="sideHeader">
                        <h1>نوشتیار</h1>
                        <button id="theme-toggle">🌙</button>
                    </div>

                    <input id="search" type="text" placeholder="جستجو...">

                    <div class="sidebar-actions">
                        <div class="buttons">
                            <button id="newFolder">پوشه جدید +</button>
                            <button id="newNote">یادداشت جدید +</button>
                        </div>
                        <div class="sortMenuContainer">
                            <select class="sortMenu" id="sortMenu">
                                <option class="sortTime" value="time">مرتب سازی بر اساس تاریخ ویرایش</option>
                                <option class="sortTitle" value="title">مرتب سازی بر اساس عنوان</option>
                            </select>
                        </div>
                    </div>

                    <h2>پوشه ها</h2>
                    <div id="folders-list"></div>

                    <h2>یادداشت ها</h2>
                    <div id="pinned-list"></div>
                    <div id="notes-list"></div>
                </aside>

                <section class="note">
                    <input type="text" id="note-title" placeholder="بدون عنوان">
                    <div class="toolbar">
                        <button id="bold-btn"><b>B</b></button>
                        <button id="italic-btn"><i>I</i></button>
                        <button id="underline-btn"><u>U</u></button>
                    </div>
                    <textarea id="note-content" placeholder="شروع به نوشتن کنید..."></textarea>
                    <div id="markdown-preview" class="hidden"></div>
                </section>
            </main>
        </div>
    </body>
    <script src="index.js"></script>
</html>
